<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shoggoth Interceptor</title>
<style>
  :root { --bg:#0d1117; --panel:rgba(22,27,34,.82); --line:#30363d; --fg:#e6edf3; --dim:#8b949e;
          --accent:#d29922; --good:#3fb950; --bad:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background-color:var(--bg);
         background-image:linear-gradient(rgba(13,17,23,.42), rgba(13,17,23,.72)),
                          url("/assets/shoggoth.png");
         background-position:center 30%; background-size:cover; background-attachment:fixed;
         color:var(--fg);
         font:14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:10px 16px;
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10;
           background:rgba(13,17,23,.92); backdrop-filter:blur(10px); }
  header h1 { font-size:15px; margin:0; color:var(--accent); }
  header .age { color:var(--dim); font-size:12px; }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:5px 12px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  main { display:grid; grid-template-columns: minmax(430px, 1fr) minmax(380px, 1fr);
         gap:0; height:calc(100vh - 49px); }
  #left { overflow-y:auto; border-right:1px solid var(--line); background:rgba(13,17,23,.68); }
  #right { overflow-y:auto; padding:14px 18px; background:rgba(13,17,23,.68); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:5px 10px; border-bottom:1px solid var(--line);
           vertical-align:top; }
  th { color:var(--dim); font-weight:normal; position:sticky; top:0; background:rgba(13,17,23,.94); }
  tr.row { cursor:pointer; }
  tr.row:hover td { background:var(--panel); }
  tr.selected td { background:rgba(31,40,51,.92); }
  .pipe { color:var(--accent); white-space:nowrap; }
  .num { color:var(--dim); }
  .label { display:inline-block; border:1px solid var(--line); border-radius:10px;
           padding:0 7px; margin:1px 2px; font-size:11px; color:var(--dim); }
  #detail h2 { font-size:15px; margin:2px 0 6px; }
  #detail .meta { color:var(--dim); font-size:12px; margin-bottom:10px; }
  /* A run log is bounded and scrolls in place: an unbounded one pushes every
     other panel off the screen, and scrollTop has nothing to move without it. */
  #launches pre.text { max-height:22rem; overflow-y:auto; }
  #launches details[open] > summary { color:#58a6ff; }
  pre.text { white-space:pre-wrap; overflow-wrap:anywhere; background:var(--panel);
             border:1px solid var(--line); border-radius:6px; padding:10px; }
  .comment { border-left:3px solid var(--line); margin:10px 0; padding-left:10px; }
  .comment .who { color:var(--accent); font-size:12px; }
  section { margin-bottom:18px; }
  details { border:1px solid var(--line); border-radius:6px; padding:6px 10px; margin:6px 0; }
  summary { cursor:pointer; color:var(--dim); }
  #excludeForm { display:flex; gap:8px; margin-top:10px; }
  #excludeForm input { flex:1; background:var(--panel); border:1px solid var(--line);
                       border-radius:6px; color:var(--fg); padding:5px 8px; font:inherit; }
  #status { margin-left:auto; font-size:12px; color:var(--dim); max-width:40%;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ok { color:var(--good); } .err { color:var(--bad); }
  a { color:#58a6ff; }
  #repoFilter, #pipeFilter { background:var(--panel); color:inherit;
                border:1px solid var(--line); border-radius:6px;
                padding:4px 6px; font:inherit; }
  td.pipe, td.pos { white-space:nowrap; }
  td.unranked { opacity:.45; }
  #eye { flex:none; }
  #eye #eyeOpen { fill:#1b1400; stroke:#6b5a1e; stroke-width:2; }
  #eye #eyePupil { fill:#3a3010; }
  #eye #eyeGlint { fill:transparent; }
  #eye #eyeLid { fill:none; stroke:#6b5a1e; stroke-width:2.5; stroke-linecap:round;
                 opacity:1; }
  /* Awake: the eye opens and the lid lifts away. */
  #eye.running #eyeOpen { fill:#ffd54a; stroke:#ffe89a; filter:drop-shadow(0 0 6px #ffcc33); }
  #eye.running #eyePupil { fill:#1a1400; }
  #eye.running #eyeGlint { fill:rgba(255,255,255,.85); }
  #eye.running #eyeLid { opacity:0; }
  #eye.running { animation:eyePulse 2.4s ease-in-out infinite; }
  @keyframes eyePulse { 0%,100% { opacity:1; } 50% { opacity:.72; } }
  /* Failed: open, and unmistakably not well. */
  #eye.failed #eyeOpen { fill:#ff5c5c; stroke:#ffb0b0; filter:drop-shadow(0 0 6px #ff3b3b); }
  #eye.failed #eyePupil { fill:#2a0000; }
  #eye.failed #eyeGlint { fill:rgba(255,255,255,.8); }
  #eye.failed #eyeLid { opacity:0; }
  #failure { border:1px solid #ff5c5c; border-radius:8px; padding:10px 12px;
             margin-bottom:12px; background:rgba(80,12,12,.35); }
  #failure h2 { color:#ff8a8a; margin:0 0 6px; }
  th.sortable { cursor:pointer; user-select:none; }
  th.sortable:hover { color:#58a6ff; }
</style>
</head>
<body>
<header>
  <!-- The eye is the run's state at a glance: open and yellow while a loop is
       awake, red when one failed, lidded when nothing is running. -->
  <svg id="eye" viewBox="0 0 64 34" width="42" height="23" role="img">
    <title id="eyeTitle">no run</title>
    <path id="eyeOpen" d="M2 17 Q32 -6 62 17 Q32 40 2 17 Z"/>
    <ellipse id="eyePupil" cx="32" cy="17" rx="6.5" ry="13"/>
    <circle id="eyeGlint" cx="29" cy="10" r="2.2"/>
    <path id="eyeLid" d="M3 17 Q32 30 61 17"/>
  </svg>
  <h1>SHOGGOTH INTERCEPTOR</h1>
  <span class="age" id="age"></span>
  <select id="repoFilter" title="Show candidates from one source repository">
    <option value="">all repositories</option>
  </select>
  <select id="pipeFilter" title="Show candidates in one ZenHub category">
    <option value="">all categories</option>
  </select>
  <button id="btnRefresh">Refresh issues</button>
  <button id="btnArchive">Cut archive</button>
  <button id="btnSmoke">Smoke launch</button>
  <button id="btnLoop">Start loop</button>
  <span id="status"></span>
</header>
<main>
  <div id="left">
    <table>
      <thead><tr><th>repository</th><th id="thNum" class="sortable">#</th><th id="thPipe">category</th><th id="thPos" class="sortable">pos</th><th>title</th><th>c</th></tr></thead>
      <tbody id="roster"></tbody>
    </table>
  </div>
  <div id="right">
    <section id="failure" hidden></section>
    <section id="detail"><p class="meta">Select a ticket.</p></section>
    <section id="rankings"></section>
    <section id="launches"></section>
    <section id="excludedList"></section>
  </div>
</main>
<script src="/console.js"></script>
</body>
</html>
